name: Build and Push to Aliyun ACR

# ============================================================
# LitShowShare - GitHub Actions Workflow
# ------------------------------------------------------------
# Build Docker image and push to Aliyun Container Registry (ACR).
# Optionally trigger a remote VPS deployment via SSH afterwards.
#
# Required GitHub Repository Secrets:
#   ACR_REGISTRY        e.g. registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE       your aliyun ACR namespace
#   ACR_IMAGE           image name, e.g. litshowshare
#   ACR_USERNAME        aliyun ACR account username
#   ACR_PASSWORD        aliyun ACR account password (use a fine-grained one)
#
# Optional Secrets (only if auto-deploy is enabled):
#   VPS_HOST            VPS IP or domain
#   VPS_USER            SSH username (e.g. root)
#   VPS_SSH_KEY         SSH private key (entire content)
#   VPS_DEPLOY_PATH     remote compose project dir (default: /opt/litshowshare)
# ============================================================

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also deploy to VPS via SSH'
        type: boolean
        default: false

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.primary_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_FULL="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_IMAGE }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PRIMARY_TAG="${{ github.ref_name }}"
          else
            PRIMARY_TAG="latest"
          fi
          echo "image_full=${IMAGE_FULL}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_FULL}"
          echo "Tags : ${PRIMARY_TAG}, ${SHORT_SHA}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image_full }}:${{ steps.meta.outputs.primary_tag }}
            ${{ steps.meta.outputs.image_full }}:${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image summary
        run: |
          {
            echo "### Image pushed to Aliyun ACR"
            echo ""
            echo "- \`${{ steps.meta.outputs.image_full }}:${{ steps.meta.outputs.primary_tag }}\`"
            echo "- \`${{ steps.meta.outputs.image_full }}:${{ steps.meta.outputs.short_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------
  # Optional: SSH into VPS and trigger docker compose pull/up.
  # Only runs when manually dispatched with deploy=true,
  # or when pushing a version tag.
  # ----------------------------------------------------------
  deploy-vps:
    name: Deploy to VPS
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/litshowshare' }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd ${DEPLOY_PATH} && \
             docker compose pull && \
             docker compose up -d && \
             docker image prune -f"
