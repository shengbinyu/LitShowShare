stages:
  - build
  - deploy

# ============================================================
# Build & push Docker image to Aliyun ACR
# ============================================================
# Required CI/CD Variables (Settings > CI/CD > Variables):
#   ACR_REGISTRY    e.g. registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE   your namespace
#   ACR_IMAGE       litshowshare
#   ACR_USERNAME    ACR account username
#   ACR_PASSWORD    ACR account password (masked)
# ============================================================
build-image:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    IMAGE_FULL: ${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_IMAGE}
  only:
    - main
  before_script:
    - echo "$ACR_PASSWORD" | docker login -u "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
  script:
    - docker build --pull
        -t "${IMAGE_FULL}:${CI_COMMIT_SHORT_SHA}"
        -t "${IMAGE_FULL}:latest"
        .
    - docker push "${IMAGE_FULL}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${IMAGE_FULL}:latest"

# ============================================================
# Deploy to VPS via SSH: pull latest image & restart containers
# ============================================================
# Required CI/CD Variables:
#   SSH_PRIVATE_KEY   SSH private key for VPS access
#   SSH_KNOWN_HOSTS   Output of: ssh-keyscan <VPS_HOST>
#   VPS_USER          SSH username (e.g. root)
#   VPS_HOST          VPS IP or domain
#   VPS_DEPLOY_PATH   Compose project dir on VPS (default: /opt/litshowshare)
# ============================================================
deploy-vps:
  stage: deploy
  image: alpine:latest
  only:
    - main
  needs:
    - build-image
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - >-
      ssh ${VPS_USER}@${VPS_HOST}
      "cd ${VPS_DEPLOY_PATH:-/opt/litshowshare} &&
       docker compose pull &&
       docker compose up -d &&
       docker image prune -f"
