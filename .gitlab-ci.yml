stages:
  - deploy

# Deploy to VPS via SSH when pushing to main branch
deploy-vps:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - ssh ${VPS_USER}@${VPS_HOST} "sudo bash ${VPS_DEPLOY_PATH:-/opt/litshowshare}/deploy/deploy.sh --update"
  variables:
    # Configure these in GitLab CI/CD Settings > Variables:
    #   SSH_PRIVATE_KEY  - SSH private key for VPS access
    #   SSH_KNOWN_HOSTS  - Output of ssh-keyscan <VPS_HOST>
    #   VPS_USER         - SSH username (e.g. root)
    #   VPS_HOST         - VPS IP address or domain
    #   VPS_DEPLOY_PATH  - Installation path on VPS (default: /opt/litshowshare)
    GIT_STRATEGY: none
